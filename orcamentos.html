<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FR Motors" />
<meta name="description" content="Módulo de orçamentos do sistema FR Motors.">
<link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./fr-icon.svg" type="image/svg+xml" />
<title>FR Motors · Orçamentos</title>

<style>
* { box-sizing: border-box; }

:root {
    --section-gap: 16px;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin:0;
    color:#17352d;
    background:
        radial-gradient(circle at top left, rgba(103, 169, 153, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(47, 111, 94, 0.12), transparent 24%),
        linear-gradient(180deg, #eff5f3 0%, #f8fbfa 100%);
}

header {
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:64px;
    background:linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #5aa796 100%);
    color:white;
    padding:16px 76px 16px 20px;
    text-align:center;
    font-weight:800;
    font-size:22px;
    letter-spacing:.45px;
    box-shadow:0 10px 24px rgba(20, 52, 44, 0.2);
    border-bottom:1px solid rgba(255,255,255,0.16);
}

header::after {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0));
    pointer-events:none;
}

.menu-btn {
    position:absolute;
    top:50%;
    right:14px;
    transform:translateY(-50%);
    background:rgba(18, 47, 39, 0.82);
    color:white;
    padding:9px 13px;
    border-radius:12px;
    cursor:pointer;
    z-index:200;
    box-shadow:0 8px 18px rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
}

.sidebar {
    position:fixed;
    top:0;
    right:0;
    width:320px;
    height:100%;
    background:#fcfefd;
    transform:translateX(100%);
    transition:.3s;
    box-shadow:-14px 0 34px rgba(18, 43, 36, 0.14);
    border-left:1px solid #dce8e4;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:150;
}
.sidebar.show { transform:translateX(0); }

.sidebar-header {
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:64px;
    background:linear-gradient(135deg, #204d41, #478978);
    color:white;
    padding:15px 20px;
    font-weight:800;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.95px;
    box-shadow:0 4px 14px rgba(0,0,0,0.12);
}

.sidebar-content {
    padding:12px;
    flex:1;
    overflow-y:auto;
    max-height:calc(100vh - 64px);
    background:#fafcfb;
}

.sidebar input {
    width:100%;
    height:38px;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid #cddbd6;
    margin-bottom:10px;
    background:#fff;
}

.sidebar-item {
    display:flex;
    gap:5px;
    margin-bottom:8px;
}

.sidebar-vazio {
    color:#666;
    font-size:14px;
    text-align:center;
    padding:12px 4px;
}

.btn-nome {
    flex:1;
    background:#edf6f3;
    color:#17352d;
    border:none;
    border-radius:10px;
    padding:8px 10px;
    font-weight:700;
    text-align:left;
}

.btn-nome:hover {
    background:#d7e9e4;
    color:#000;
    transform:none;
}

.btn-delete {
    width:36px;
    background:#255a4c;
    color:white;
    border:none;
    border-radius:10px;
}

.btn-delete:hover {
    background:#1f4f43;
}


.dados-orcamento {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin:0;
    padding:14px;
    background:linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
    border:1px solid #dbe8e4;
    border-radius:18px;
    box-shadow:0 12px 28px rgba(19, 53, 45, 0.07);
}

.dados-orcamento input {
    margin-right:0;
    min-width:180px;
    height:40px;
}

.info-impressao,
.info-imagem {
    display:none;
}

#linhaPerc {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 10px;
    line-height:1.1;
    margin:0;
    padding:12px 14px;
    background:linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
    border:1px solid #dbe8e4;
    border-radius:18px;
    box-shadow:0 12px 28px rgba(19, 53, 45, 0.07);
}

#linhaPerc > strong {
    display:inline-flex;
    align-items:center;
    min-height:42px;
    margin-right:2px;
}

.loja-controle {
    display:inline-grid;
    grid-template-columns:35px auto 60px auto;
    align-items:center;
    column-gap:5px;
    min-height:40px;
    margin:2px 0;
    padding:6px 7px;
    border-radius:12px;
    border:1px solid #e2ede9;
    background:linear-gradient(180deg, #fbfdfc 0%, #f4faf7 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);
    vertical-align:middle;
}

.loja-nome-label {
    display:flex;
    align-items:center;
    justify-content:flex-start;
    width:auto;
    max-width:150px;
    min-height:36px;
    padding:0 2px;
    border-radius:0;
    background:transparent;
    color:#17352d;
    font-weight:800;
    overflow:visible;
    text-overflow:clip;
    white-space:normal;
    line-height:1.12;
    text-align:left;
    word-break:break-word;
}

.loja-nome-input {
    width:92px !important;
    margin-right:0 !important;
    font-weight:700;
    text-align:left;
    background:#fff !important;
}

.loja-perc-input {
    width:60px !important;
    height:34px;
    margin-right:0 !important;
    text-align:center;
    background:#fff !important;
}

.btn-mini {
    padding:6px 8px;
    border-radius:6px;
    font-size:12px;
    line-height:1;
}

.btn-loja-delete {
    width:35px;
    height:34px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:#255a4c;
    color:white;
    border:none;
    border-radius:6px;
}

.btn-loja-delete:hover {
    background:#1f4f43;
}

.opcoes-container,
.descontos-container {
    display:flex;
    flex-direction:column;
    gap:4px;
}

.marca-opcao {
    display:grid;
    grid-template-columns:28px minmax(94px, 1fr) 104px;
    align-items:start;
    gap:5px;
    min-height:36px;
    padding:3px 0;
    border-bottom:1px solid #edf2f0;
}

.desc-opcao {
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:36px;
    padding:3px 0;
    border-bottom:1px solid #edf2f0;
}

.marca-opcao:last-child,
.desc-opcao:last-child {
    border-bottom:none;
}

.marca-opcao-placeholder,
.desc-opcao-placeholder{
    pointer-events:none;
    visibility:hidden;
    border-bottom:1px solid transparent!important;
}
.marca-opcao-placeholder{
    grid-template-columns:28px minmax(94px, 1fr) 104px;
}
.marca-opcao-placeholder .placeholder-box,
.desc-opcao-placeholder .placeholder-box{
    width:100%;
    min-height:36px;
    height:36px;
    border:0;
    background:transparent;
}
.marca-opcao-placeholder .placeholder-delete{
    width:28px;
    min-height:36px;
    height:36px;
    background:transparent;
}

.marca-input {
    min-width:0 !important;
    width:100% !important;
    max-width:100% !important;
    min-height:36px;
    height:36px;
    display:block;
    resize:none;
    overflow:hidden;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    line-height:1.2;
    text-align:left;
    font-family:inherit;
    font-size:12px;
    padding:7px 8px;
    background:#ffffff;
    box-sizing:border-box;
}

.valor-input,
.desc-input {
    width:104px !important;
    min-width:104px;
    max-width:104px;
    min-height:36px;
    height:36px;
    box-sizing:border-box;
    display:block;
    padding:8px;
}

.desc-opcao .desc-input{
    flex:0 0 36px;
    align-self:flex-start;
    margin-top:0!important;
    margin-bottom:0!important;
}

.btn-add-marca,
.btn-remover-marca {
    padding:4px 7px;
    border-radius:6px;
    font-size:11px;
    line-height:1.1;
}

.btn-add-marca {
    align-self:flex-start;
    background:linear-gradient(135deg, #4f9a8b 0%, #66b5a3 100%);
    margin-top:3px;
    padding:6px 10px;
    border-radius:10px;
    font-size:11px;
    box-shadow:0 8px 16px rgba(79, 154, 139, 0.15);
}

.btn-remover-marca {
    width:28px;
    min-height:36px;
    height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    align-self:start;
    padding:0;
    background:#255a4c;
    color:#fff;
    font-size:13px;
    line-height:1;
}

.btn-remover-marca:hover {
    background:#1f4f43;
}

.main {
    max-width:1780px;
    margin:0 auto;
    padding:18px 20px 28px;
    display:flex;
    flex-direction:column;
    gap:var(--section-gap);
}

.main > br {
    display:none;
}

.main input,
.main textarea {
    padding:8px 10px;
    border-radius:12px;
    border:1px solid #cfdcd8;
    margin-right:5px;
    background:linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
    color:#17352d;
    transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease, transform .18s ease;
}

.main input:focus,
.main textarea:focus,
.sidebar input:focus {
    outline:none;
    border-color:#67a999;
    box-shadow:0 0 0 3px rgba(79, 154, 139, 0.12);
    background:#fff;
}

.table-container {
    overflow-x:auto;
    margin:0;
    padding:12px;
    background:linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
    border:1px solid #dbe8e4;
    border-radius:20px;
    box-shadow:0 18px 36px rgba(19, 53, 45, 0.08);
}

table {
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px #e4ece9;
}

th, td {
    padding:7px 8px;
    text-align:center;
    vertical-align:top;
}

/* PADRONIZA TODAS AS COLUNAS */
thead tr:nth-child(2) th,
tbody td:not(:first-child),
tfoot td:not(:first-child) {
    width:100px;
    min-width:100px;
    max-width:100px;
}

.subhead-valor,
.valor-td,
.total-valor {
    width:250px !important;
    min-width:250px !important;
    max-width:320px !important;
}

.subhead-desc,
.desc-td,
.total-desc {
    width:126px !important;
    min-width:126px !important;
    max-width:126px !important;
}

.peca-cell {
    display:grid;
    grid-template-columns:34px minmax(0, 1fr);
    align-items:start;
    gap:6px;
    width:100%;
}

.peca-input {
    width:100% !important;
    min-width:0 !important;
    max-width:100% !important;
    min-height:38px;
    font-family:inherit;
    font-size:clamp(14px, 0.75vw + 9px, 16px);
    line-height:1.25;
    resize:none;
    overflow:hidden;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    text-transform:uppercase;
}

.peca-print-text {
    display:none;
}

.btn-remover-peca {
    width:30px;
    height:30px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border-radius:6px;
    background:#255a4c;
    color:#fff;
    font-size:13px;
    line-height:1;
    flex:0 0 auto;
}

.btn-remover-peca:hover {
    background:#1f4f43;
}

th:first-child, td:first-child {
    width:clamp(280px, 30vw, 520px);
    min-width:280px;
}

thead th:first-child {
    text-align:center;
}

tbody td:first-child,
tfoot td:first-child {
    text-align:left;
}

thead {
    background:#d9ece6;
}

thead tr:first-child th {
    background:linear-gradient(180deg, #dcefe9 0%, #d2e8e1 100%);
    font-weight:800;
    vertical-align:middle;
    text-align:center;
    font-size:13px;
    color:#17352d;
    border-bottom:1px solid #d0e2dc;
}

.loja-header-name {
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:40px;
    width:100%;
    padding:3px 6px;
    line-height:1.12;
    white-space:normal;
    word-break:break-word;
    text-align:center;
}

.valor-head-grid {
    display:grid;
    grid-template-columns:28px minmax(94px, 1fr) 104px;
    align-items:center;
    gap:5px;
    width:100%;
}

.valor-head-grid span:nth-child(2) {
    text-align:left;
    padding-left:2px;
}

.valor-head-grid span:last-child {
    text-align:center;
}

thead tr:nth-child(2) {
    background:#cde8e1;
}

thead tr:nth-child(2) th {
    background:linear-gradient(180deg, #f4faf7 0%, #edf6f3 100%);
    background-clip:padding-box;
    text-align:center;
    font-size:12px;
    font-weight:800;
    color:#21483d;
}

.subhead-valor,
.subhead-desc {
    background:#edf6f3;
}

.subhead-left-rounded,
.subhead-right-rounded {
    border-radius:0;
}

tbody td { font-weight: normal; }

tbody tr:nth-child(even) { background:#fbfdfc; }

tbody tr:hover { background:#f3faf7; }

td input,
td textarea {
    width:100%;
    border:none;
    outline:none;
    text-align:right;
    background:transparent;
    margin:0;
    padding:4px 0;
}

td:first-child input,
td:first-child textarea { text-align:left; }

.valor-bloco {
    display:flex;
    flex-direction:column;
    gap:3px;
}

.valor-input::placeholder {
    color:#888;
}

.marca-input {
    text-align:left;
    font-size:12px;
    padding:7px 8px;
}

.marca-input::placeholder {
    color:#888;
}

.peca-divider {
    border-right:1px solid #e2ece8 !important;
}

.loja-divider {
    border-right:1px solid #e2ece8 !important;
}

 tbody td, thead th, tfoot td {
    border-bottom:1px solid #eef4f2;
}

 tbody tr:last-child td,
 tfoot tr td {
    border-bottom:none;
}

.menor {
    background:linear-gradient(180deg, #d8f1e8 0%, #caebdf 100%) !important;
    font-weight:800;
    border-radius:12px;
    box-shadow:inset 0 0 0 1px rgba(101, 170, 151, 0.20);
}

.total {
    background:linear-gradient(180deg, #f5f7f6 0%, #edf1ef 100%);
    font-weight:800;
}

.botoes {
    margin-top:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:2px 0;
}

button {
    padding:9px 14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(135deg, #2f6f5e 0%, #4f9a8b 100%);
    color:white;
    font-weight:700;
    letter-spacing:.12px;
    transition:.18s ease;
    box-shadow:0 10px 18px rgba(47, 111, 94, 0.16);
}

button:hover {
    background:linear-gradient(135deg, #255a4c 0%, #3c8878 100%);
    transform:translateY(-1px);
    box-shadow:0 12px 22px rgba(37, 90, 76, 0.2);
}


/* =========================================================
   v41 - FUNDO CLARO UNIFORME
   Ajuste apenas visual: mantém toda a lógica original.
   ========================================================= */

:root {
    --fundo-claro-uniforme: #fbfdfc;
}

/* Igualando os fundos externos e dos blocos para a cor mais clara do layout */
body {
    background: var(--fundo-claro-uniforme) !important;
}

.main {
    background: var(--fundo-claro-uniforme) !important;
}

.dados-orcamento,
#linhaPerc,
.table-container {
    background: var(--fundo-claro-uniforme) !important;
}

/* Remove variações de degradê nos blocos principais */
.dados-orcamento,
#linhaPerc,
.table-container,
.loja-controle,
table {
    background-image: none !important;
}

/* Mantém a tabela limpa, sem alterar a lógica nem os destaques */
table {
    background-color: #ffffff !important;
}

tbody tr:nth-child(even) {
    background: #ffffff !important;
}

tbody tr:hover {
    background: #f4faf7 !important;
}



/* =========================================================
   v42 - BARRA VERDE + SIDEBAR COM GRADIENTE DO CABEÇALHO
   Ajuste apenas visual: mantém toda a lógica original.
   ========================================================= */

/* Barra verde lateral nos blocos principais */
.dados-orcamento,
#linhaPerc {
    position: relative;
    overflow: hidden;
    padding-left: 26px !important;
}

.dados-orcamento::before,
#linhaPerc::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 16px;
    bottom: 16px;
    width: 5px;
    border-radius: 999px;
    background: linear-gradient(180deg, #1f4f43 0%, #2f6f5e 48%, #5aa796 100%);
    box-shadow: 0 4px 10px rgba(47, 111, 94, 0.20);
}

/* Descrição DESCONTOS (%) mais forte */
#linhaPerc > strong {
    font-weight: 900 !important;
    color: #143c32;
    letter-spacing: .2px;
}

/* Botão da sidebar/menu com o mesmo degradê do cabeçalho */
.menu-btn {
    background: linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #5aa796 100%) !important;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 18px rgba(31, 79, 67, 0.22);
}

/* Botões da própria sidebar seguindo o mesmo acabamento visual */
.btn-nome,
.btn-delete {
    border-radius: 12px;
}

.btn-delete {
    background: linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #5aa796 100%) !important;
    box-shadow: 0 6px 14px rgba(31, 79, 67, 0.16);
}



/* =========================================================
   v43 - MENU COM TOM MAIS ESCURO + SOMBRA NO TÍTULO
   Ajuste apenas visual: mantém toda a lógica original.
   ========================================================= */

/* Deixa o lado claro do degradê do botão um pouco mais escuro, mantendo o gradiente */
.menu-btn {
    background: linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #4b9384 100%) !important;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 18px rgba(31, 79, 67, 0.24);
}

/* Mesmo ajuste visual para o botão de excluir da sidebar */
.btn-delete {
    background: linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #4b9384 100%) !important;
    box-shadow: 0 6px 14px rgba(31, 79, 67, 0.18);
}

/* Pequeno destaque no texto do cabeçalho para melhorar a leitura */
header > span {
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.20), 0 1px 2px rgba(0, 0, 0, 0.16);
}



/* =========================================================
   v44 - GRADIENTE MEIO TERMO + PEÇAS ALINHADAS
   Ajuste apenas visual: mantém toda a lógica original.
   ========================================================= */

/* Meio termo entre o gradiente mais claro da v42 e o mais escuro da v43 */
.menu-btn {
    background: linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #529b8b 100%) !important;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 18px rgba(31, 79, 67, 0.24);
}

.btn-delete {
    background: linear-gradient(135deg, #1f4f43 0%, #2f6f5e 42%, #529b8b 100%) !important;
    box-shadow: 0 6px 14px rgba(31, 79, 67, 0.18);
}

/* Cabeçalho com leitura mais forte, sem exagerar */
header > span {
    text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.28),
        0 1px 3px rgba(0, 0, 0, 0.24);
}

/* Caixa de PEÇAS alinhada com as demais caixas da linha */
.peca-cell {
    grid-template-columns:36px minmax(0, 1fr);
    align-items:start;
}

.peca-input {
    min-height:36px !important;
    height:36px;
    padding:7px 8px !important;
    line-height:1.2;
    border-radius:10px;
}

.btn-remover-peca {
    width:36px;
    height:36px;
    min-height:36px;
    border-radius:10px;
}



/* =========================================================
   v45 - SOMBRA NO MENU + PEÇAS ALINHADAS HORIZONTALMENTE
   Ajuste apenas visual: mantém toda a lógica original.
   ========================================================= */

/* Um pouco mais de sombra atrás do botão da sidebar/menu */
.menu-btn {
    box-shadow:
        0 10px 22px rgba(31, 79, 67, 0.22),
        0 4px 10px rgba(0, 0, 0, 0.12) !important;
}

/* Ajuste fino para o campo de PEÇAS começar na mesma linha visual das outras caixas */
.peca-cell {
    grid-template-columns: 36px minmax(0, 1fr);

   A coluna PEÇAS permanece visível; apenas as lojas deslizam.
   ========================================================= */
@media screen {
    .table-container {
        position: relative;
        overflow-x: auto;
        overflow-y: visible;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
    }

    /* O overflow do próprio table não pode capturar o sticky. */
    .table-container table {
        overflow: visible;
    }

    thead th:first-child,
    tbody td:first-child,
    tfoot td:first-child {
        position: sticky;
        left: 0;
        background-clip: padding-box;
        box-shadow: 10px 0 14px -14px rgba(19, 53, 45, .55);
    }

    thead th:first-child {
        z-index: 8;
        background: linear-gradient(180deg, #dcefe9 0%, #d2e8e1 100%) !important;

        z-index: 5;
        background: #ffffff !important;
    }

        background: #f4faf7 !important;
    }

        z-index: 7;
        background: linear-gradient(180deg, #f5f7f6 0%, #edf1ef 100%) !important;
    }
}

/* =========================================================
   FR MOTORS V4.4.1 · CORREÇÃO ISOLADA DA COLUNA PEÇAS
   Mantém toda a V4.4; corrige apenas o sticky que atingia
   também o primeiro subcabeçalho MARCA da primeira loja.
   ========================================================= */
@media screen {
    /* Somente a célula PEÇAS da primeira linha do cabeçalho fica fixa. */
    thead tr:first-child > th:first-child,
    tbody > tr > td:first-child,
    tfoot > tr > td:first-child {
        position: sticky !important;
        left: 0 !important;
        background-clip: border-box !important;
    }

    thead tr:first-child > th:first-child {
        z-index: 20 !important;
        background: var(--orc-dark) !important;
        color: #fff !important;
    }

    tbody > tr > td:first-child {
        z-index: 12 !important;
        background: #fff !important;
    }

    tbody tr:nth-child(even) > td:first-child {
        background: #fafbfb !important;
    }

    tbody tr:hover > td:first-child {
        background: #f3f7f7 !important;
    }

    tfoot > tr > td:first-child {
        z-index: 15 !important;
        background: #f1f4f5 !important;
    }

    /* Este era o elemento que também ficava sticky e causava a sobreposição. */
    thead tr:nth-child(2) > th:first-child {
        position: relative !important;
        left: auto !important;
        z-index: 1 !important;
        box-shadow: none !important;
    }

    thead tr:first-child > th:not(:first-child) {
        position: relative;
        z-index: 1;
    }
}

<script>

let lojas = [
    { nome:"PARQUE", perc:15 },
    { nome:"MEGA", perc:14.5 },
    { nome:"LOPES", perc:10 }
];

const sidebar = document.getElementById("sidebar");
const STORAGE_KEY = "orcamentos_fr_motors"; // legado local: usado apenas para migração para a nuvem
const MARCAS_KEY = "orcamentos_fr_motors_marcas";
const DISCOUNTS_COLLAPSE_KEY = "frmotors_orc_discounts_collapsed";
const MIGRATION_PROMPT_KEY = "frmotors_orcamentos_cloud_migration_prompted_v42";
const SUPABASE_URL = "https://rtdndffvbxhrhftqstwx.supabase.co";
const SUPABASE_KEY = "sb_publishable_GNEnPdYBORFFfjBpBCzwxw_ELB234Ip";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let orcamentosCache = [];
let currentOrcamentoId = null;
let currentUser = null;
let cloudOrcamentosReady = true;
let cloudOrcamentosError = '';

function uuid(){
    if(window.crypto?.randomUUID) return window.crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
        return v.toString(16);
    });
}

function setCloudStatus(texto, ok=true){
    const el = document.getElementById('cloudStatusOrc');
    if(!el) return;
    el.textContent = texto;
    el.classList.toggle('cloud-loading', !ok);
}

function showAuth(){
    const tela = document.getElementById('loginScreen');
    if(tela) tela.style.display = currentUser ? 'none' : 'flex';
    setCloudStatus(currentUser ? `Online · ${currentUser.email || 'usuário'}` : 'Desconectado', !!currentUser);
}

async function signInOrc(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = 'Entrando...';
    const { data, error } = await db.auth.signInWithPassword({email,password});
    if(error){ msg.textContent = error.message; return; }
    currentUser = data.user; msg.textContent = ''; showAuth(); await carregarOrcamentosNuvem();
}

async function magicLinkOrc(){
    const email = document.getElementById('loginEmail').value.trim();
    const msg = document.getElementById('loginMsg');
    if(!email){ msg.textContent = 'Digite seu e-mail.'; return; }
    msg.textContent = 'Enviando...';
    const { error } = await db.auth.signInWithOtp({email, options:{emailRedirectTo:window.location.href.split('#')[0]}});
    msg.textContent = error ? error.message : 'Link enviado. Confira seu e-mail.';
}

async function logoutOrc(){
    await db.auth.signOut();
    currentUser = null; currentOrcamentoId = null; orcamentosCache = [];
    renderLista(); showAuth();
}

async function getSessionOrc(){
    const { data, error } = await db.auth.getSession();
    if(error) throw error;
    currentUser = data.session?.user || null;
    showAuth();
    if(currentUser) await carregarOrcamentosNuvem();
}

function mapOrcamento(row){
    return {
        id: row.id, titulo: row.titulo || 'ORÇAMENTO', data: row.data || '',
        carro: row.carro || '', placa: row.placa || '',
        lojas: Array.isArray(row.lojas) ? row.lojas : [],
        linhas: Array.isArray(row.linhas) ? row.linhas : [],
        created_at: row.created_at, updated_at: row.updated_at
    };
}

function carregarOrcamentosLocais(){
    let locais = [];
    try { locais = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e){ locais = []; }
    if(!Array.isArray(locais)) locais = [];

    let alterou = false;
    locais = locais.map(item => {
        if(!item || typeof item !== 'object') return null;
        if(!item.id){ item.id = uuid(); alterou = true; }
        return {
            id:item.id,
            titulo:item.titulo || 'ORÇAMENTO',
            data:item.data || '',
            carro:item.carro || '',
            placa:item.placa || '',
            lojas:Array.isArray(item.lojas) ? item.lojas : [],
            linhas:Array.isArray(item.linhas) ? item.linhas : [],
            created_at:item.created_at || item.updated_at || new Date().toISOString(),
            updated_at:item.updated_at || item.created_at || new Date().toISOString()
        };
    }).filter(Boolean);

    if(alterou){
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(locais)); } catch(e){ console.error(e); }
    }
    return locais.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
}

function salvarCacheLocal(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(orcamentosCache)); }
    catch(e){ console.error('Falha ao salvar orçamento localmente:', e); }
}

function ativarModoLocal(erro=''){
    cloudOrcamentosReady = false;
    cloudOrcamentosError = String(erro || '');
    orcamentosCache = carregarOrcamentosLocais();
    renderLista(document.getElementById('busca')?.value || '');
    importarMarcasDosOrcamentos();
    renderDatalistMarcas();
    setCloudStatus('Modo local · nuvem pendente', false);
}

async function carregarOrcamentosNuvem(){
    if(!currentUser) return;
    setCloudStatus('Sincronizando...', false);
    const { data, error } = await db.from('orcamentos').select('*').order('updated_at',{ascending:false});
    if(error){
        console.error(error);
        ativarModoLocal(error.message || error);
        return;
    }
    cloudOrcamentosReady = true;
    cloudOrcamentosError = '';
    orcamentosCache = (data || []).map(mapOrcamento);
    renderLista(document.getElementById('busca')?.value || '');
    importarMarcasDosOrcamentos();
    renderDatalistMarcas();
    setCloudStatus(`Online · ${currentUser.email || 'usuário'}`, true);
    await oferecerMigracaoLocal();
}

async function oferecerMigracaoLocal(){
    if(!cloudOrcamentosReady || localStorage.getItem(MIGRATION_PROMPT_KEY) === '1' || !currentUser) return;
    let locais = [];
    try { locais = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e){}
    localStorage.setItem(MIGRATION_PROMPT_KEY, '1');
    if(!Array.isArray(locais) || !locais.length) return;
    if(!confirm(`Encontramos ${locais.length} orçamento(s) salvos somente neste navegador. Deseja enviá-los para a nuvem agora?`)) return;
    setCloudStatus('Migrando orçamentos...', false);
    let ok = 0, falhas = 0;
    for(const item of locais){
        const payload = {
            id: uuid(), titulo:item.titulo || 'ORÇAMENTO', data:item.data || null,
            carro:normalizarTexto(item.carro || '') || null, placa:normalizarTexto(item.placa || '') || null,
            lojas:Array.isArray(item.lojas) ? item.lojas : [], linhas:Array.isArray(item.linhas) ? item.linhas : [],
            updated_at:new Date().toISOString()
        };
        const { error } = await db.from('orcamentos').insert(payload);
        if(error){ falhas++; console.error(error); } else ok++;
    }
    if(ok && !falhas) localStorage.removeItem(STORAGE_KEY);
    await carregarOrcamentosNuvemSemMigracao();
    alert(falhas ? `Migração concluída: ${ok} enviado(s), ${falhas} falha(s). Os dados locais foram preservados.` : `${ok} orçamento(s) migrado(s) para a nuvem.`);
}

async function carregarOrcamentosNuvemSemMigracao(){
    const { data, error } = await db.from('orcamentos').select('*').order('updated_at',{ascending:false});
    if(error){ console.error(error); return; }
    orcamentosCache = (data || []).map(mapOrcamento);
    renderLista(document.getElementById('busca')?.value || '');
    importarMarcasDosOrcamentos();
    renderDatalistMarcas();
    setCloudStatus(`Online · ${currentUser?.email || 'usuário'}`, true);
}

function moeda(v){
    return "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function parseMoeda(valor){
    if(valor === null || valor === undefined) return 0;

    if(typeof valor === 'number'){
        return Number.isFinite(valor) ? valor : 0;
    }

    const textoOriginal = String(valor).trim();
    if(!textoOriginal) return 0;

    const texto = textoOriginal.replace(/\s/g, '').replace(/^R\$/i, '');

    if(texto.includes(',')){
        const normalizado = texto.replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
        const numero = Number(normalizado);
        return Number.isFinite(numero) ? numero : 0;
    }

    const numeroDireto = Number(texto.replace(/[^\d.-]/g, ''));
    return Number.isFinite(numeroDireto) ? numeroDireto : 0;
}

function parsePercentual(valor){
    const texto = String(valor ?? '').replace(',', '.').replace(/[^\d.-]/g, '');
    const numero = Number(texto);
    return Number.isFinite(numero) ? numero : 0;
}

function normalizarTexto(texto){
    return String(texto ?? '').toLocaleUpperCase('pt-BR');
}

function normalizarValorSalvo(valor){
    if(valor === null || valor === undefined || valor === '') return '';
    const numero = parseMoeda(valor);
    return numero ? moeda(numero) : '';
}

function prepararEdicaoMoeda(input){
    const numero = parseMoeda(input.value);
    input.value = numero ? numero.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : '';
}

function formatarValorAoDigitar(input){
    const digitos = String(input.value || '').replace(/\D/g, '');

    if(!digitos){
        input.value = '';
        return;
    }

    const numero = Number(digitos) / 100;
    input.value = numero.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function formatarMoedaInput(input){
    const numero = parseMoeda(input.value);
    input.value = numero ? moeda(numero) : '';
}

function sincronizarTextoPeca(input){
    if(!input || !input.classList?.contains('peca-input')) return;

}

function ajustarCampoPeca(input){
    if(!input || !input.classList?.contains('peca-input')) return;

    input.style.minWidth = '0';
    input.style.width = '100%';
    input.style.maxWidth = '100%';
    input.title = input.value || '';

    if(input.tagName === 'TEXTAREA'){
        input.style.height = 'auto';
        const altura = Math.max(36, input.scrollHeight);
        input.style.height = `${altura}px`;
    }

    sincronizarTextoPeca(input);
}

function ajustarCampoMarca(input){
    if(!input || !input.classList?.contains('marca-input')) return;

    const texto = normalizarTexto(input.value || '').trim();
    input.title = texto;
    input.style.minWidth = '0';
    input.style.width = '100%';
    input.style.maxWidth = '100%';
    input.style.whiteSpace = 'pre-wrap';
    input.style.overflowWrap = 'anywhere';
    input.style.wordBreak = 'break-word';
    input.style.overflow = 'hidden';

    if(input.tagName === 'TEXTAREA'){
        input.style.height = 'auto';
        const altura = Math.max(36, input.scrollHeight);
        input.style.height = `${altura}px`;
    }

    const tr = input.closest('tr');
    if(tr){
        requestAnimationFrame(() => sincronizarLinhasVisuais(tr));
    }
}

function aplicarMaiusculas(input){
    if(!input || input.classList?.contains('valor-input')) return;

    const tipo = (input.getAttribute('type') || 'text').toLowerCase();
    const podeConverter = input.matches('textarea') || ['text', 'search', 'email', 'tel', 'url', ''].includes(tipo);
    if(!podeConverter) return;

    const inicio = input.selectionStart;
    const fim = input.selectionEnd;
    const valor = input.value;
    const novoValor = normalizarTexto(valor);

    if(valor !== novoValor){
        input.value = novoValor;
        if(typeof inicio === 'number' && typeof fim === 'number'){
            input.setSelectionRange(inicio, fim);
        }
    }

    ajustarCampoPeca(input);
    ajustarCampoMarca(input);
}

function atualizarNomeLoja(indice, valor){
    if(!lojas[indice]) return;

    const novoNome = normalizarTexto(valor || '').trim().toLocaleUpperCase('pt-BR') || `LOJA ${indice + 1}`;
    if(lojas[indice].nome === novoNome) return;

    const linhasAtuais = capturarLinhas(true, lojas.length);
    lojas[indice].nome = novoNome;
    renderTabela(linhasAtuais);
    renderPerc();
}

function addLoja(){
    const nomeDigitado = prompt("Nome da loja:");
    if(!nomeDigitado) return;

    const linhasAtuais = capturarLinhas(true, lojas.length);
    const perc = parsePercentual(prompt("Desconto %:", "0") || 0);
    const nome = normalizarTexto(nomeDigitado.trim()).toLocaleUpperCase('pt-BR');

    lojas.push({ nome, perc });

    const linhasAtualizadas = linhasAtuais.map(linha => ({
        ...linha,
        valores: [...(linha.valores || []), ""],
        marcas: [...(linha.marcas || []), []],
        opcoes: [...normalizarOpcoesPorLoja(linha, lojas.length - 1), [{ marca:'', valor:'' }]]
    }));

    renderTabela(linhasAtualizadas);
    renderPerc();
}

function editarLoja(indice){
    atualizarNomeLoja(indice, lojas[indice]?.nome || `LOJA ${indice + 1}`);
}

function excluirLoja(indice){
    if(!lojas[indice]) return;

    if(lojas.length <= 1){
        alert('É necessário manter pelo menos uma loja.');
        return;
    }

    const nome = lojas[indice].nome;
    if(!confirm(`Excluir a loja ${nome}? Os valores e marcas dessa coluna também serão removidos.`)) return;

    const linhasAtualizadas = capturarLinhas(true, lojas.length).map(linha => ({
        ...linha,
        valores: (linha.valores || []).filter((_, i) => i !== indice),
        marcas: (linha.marcas || []).filter((_, i) => i !== indice),
        opcoes: (linha.opcoes || []).filter((_, i) => i !== indice)
    }));

    lojas.splice(indice, 1);
    renderTabela(linhasAtualizadas);
    renderPerc();
}

function normalizarListaMarcas(valor){
    if(Array.isArray(valor)){
        const lista = valor.flatMap(item => normalizarListaMarcas(item)).filter(Boolean);
        return lista.length ? lista : [''];
    }

    if(valor && typeof valor === 'object'){
        return normalizarListaMarcas(valor.marca || '');
    }

    const texto = normalizarTexto(valor || '').trim();
    if(!texto) return [''];

    const lista = texto
        .split(/[,;\n]+/)
        .map(item => normalizarTexto(item.trim()))
        .filter(Boolean);

    return lista.length ? lista : [''];
}

function normalizarOpcoesLoja(valor, valorAntigo = ''){
    let opcoes = [];

    if(Array.isArray(valor)){
        valor.forEach((item, idx) => {
            if(item && typeof item === 'object' && !Array.isArray(item)){
                opcoes.push({
                    marca: normalizarTexto(item.marca || '').trim(),
                    valor: normalizarValorSalvo(item.valor || item.preco || item.valorSemDesconto || '')
                });
            } else {
                const marcas = normalizarListaMarcas(item);
                marcas.forEach((marca, marcaIdx) => {
                    opcoes.push({
                        marca,
                        valor: idx === 0 && marcaIdx === 0 ? normalizarValorSalvo(valorAntigo) : ''
                    });
                });
            }
        });
    } else if(valor && typeof valor === 'object'){
        opcoes.push({
            marca: normalizarTexto(valor.marca || '').trim(),
            valor: normalizarValorSalvo(valor.valor || valor.preco || valor.valorSemDesconto || valorAntigo || '')
        });
    } else {
        const marcas = normalizarListaMarcas(valor || '');
        marcas.forEach((marca, idx) => {
            opcoes.push({
                marca,
                valor: idx === 0 ? normalizarValorSalvo(valorAntigo) : ''
            });
        });
    }

    opcoes = opcoes
        .map(opcao => ({
            marca: normalizarTexto(opcao.marca || '').trim(),
            valor: normalizarValorSalvo(opcao.valor || '')
        }))
        .filter((opcao, idx) => idx === 0 || opcao.marca || opcao.valor);

    return opcoes.length ? opcoes : [{ marca:'', valor:'' }];
}

function normalizarOpcoesPorLoja(dados = {}, quantidade = lojas.length){
    return Array.from({ length: quantidade }, (_, i) => {
        if(dados.opcoes && Array.isArray(dados.opcoes) && dados.opcoes[i] !== undefined){
            return normalizarOpcoesLoja(dados.opcoes[i]);
        }

        return normalizarOpcoesLoja(dados.marcas?.[i] || '', dados.valores?.[i] || '');
    });
}

function normalizarMarcasPorLoja(marcas = [], quantidade = lojas.length){
    return Array.from({ length: quantidade }, (_, i) => normalizarListaMarcas(marcas?.[i] || ''));
}

function sincronizarLinhasVisuais(tr){
    if(!tr) return;

    tr.querySelectorAll('.marca-opcao-placeholder, .desc-opcao-placeholder').forEach(el => el.remove());
    tr.querySelectorAll('.marca-opcao[data-loja], .desc-opcao[data-loja]').forEach(el => {
        el.style.height = '';
        el.style.minHeight = '';
    });

    const quantidades = lojas.map((_, i) => tr.querySelectorAll(`.marca-opcao[data-loja="${i}"]`).length || 0);
    const maxOpcoes = Math.max(1, ...quantidades);

    lojas.forEach((_, i) => {
        const opcoesContainer = tr.querySelector(`.opcoes-container[data-loja="${i}"]`);
        const descontosContainer = tr.querySelector(`.descontos-container[data-loja="${i}"]`);
        if(!opcoesContainer || !descontosContainer) return;

        for(let idx = quantidades[i]; idx < maxOpcoes; idx++){
            opcoesContainer.insertAdjacentHTML('beforeend', criarOpcaoValorPlaceholderHtml(idx));
            descontosContainer.insertAdjacentHTML('beforeend', criarOpcaoDescontoPlaceholderHtml(idx));
        }
    });

    for(let idx = 0; idx < maxOpcoes; idx++){
        const elementos = [];

        lojas.forEach((_, i) => {
            const marcaReal = tr.querySelector(`.marca-opcao[data-loja="${i}"][data-opcao="${idx}"]`);
            const descontoReal = tr.querySelector(`.desc-opcao[data-loja="${i}"][data-opcao="${idx}"]`);
            const marcaPlaceholder = tr.querySelector(`.opcoes-container[data-loja="${i}"] .marca-opcao-placeholder[data-visual-index="${idx}"]`);
            const descontoPlaceholder = tr.querySelector(`.descontos-container[data-loja="${i}"] .desc-opcao-placeholder[data-visual-index="${idx}"]`);

            if(marcaReal) elementos.push(marcaReal);
            if(descontoReal) elementos.push(descontoReal);
            if(marcaPlaceholder) elementos.push(marcaPlaceholder);
            if(descontoPlaceholder) elementos.push(descontoPlaceholder);
        });

        const reais = elementos.filter(el => !el.classList.contains('marca-opcao-placeholder') && !el.classList.contains('desc-opcao-placeholder'));
        const altura = Math.max(42, ...reais.map(el => Math.ceil(el.getBoundingClientRect().height || 0)));

        elementos.forEach(el => {
            el.style.height = `${altura}px`;
            el.style.minHeight = `${altura}px`;
        });
    }
}

function atualizarIndicesOpcoes(tr, lojaIndex){
    const opcoes = [...tr.querySelectorAll(`.marca-opcao[data-loja="${lojaIndex}"]`)];
    const descontos = [...tr.querySelectorAll(`.desc-opcao[data-loja="${lojaIndex}"]`)];

    opcoes.forEach((opcao, idx) => {
        opcao.dataset.opcao = String(idx);
        opcao.querySelectorAll('[data-opcao]').forEach(el => el.dataset.opcao = String(idx));
    });

    descontos.forEach((desconto, idx) => {
        desconto.dataset.opcao = String(idx);
        desconto.querySelectorAll('[data-opcao]').forEach(el => el.dataset.opcao = String(idx));
    });
}

function addMarcaCampo(botao, opcao = { marca:'', valor:'' }){
    const bloco = botao.closest('.valor-bloco');
    const tr = botao.closest('tr');
    const container = bloco.querySelector('.opcoes-container');
    const lojaIndex = Number(container.dataset.loja);
    const descContainer = tr.querySelector(`.descontos-container[data-loja="${lojaIndex}"]`);
    const opcaoIndex = container.querySelectorAll('.marca-opcao').length;

    container.insertAdjacentHTML('beforeend', criarOpcaoValorHtml(lojaIndex, opcaoIndex, opcao));
    descContainer.insertAdjacentHTML('beforeend', criarOpcaoDescontoHtml(lojaIndex, opcaoIndex));
    atualizarIndicesOpcoes(tr, lojaIndex);
    recalcularLinha(tr);
    calcular();

    const input = container.querySelector('.marca-opcao:last-child .marca-input');
    if(input){
        ajustarCampoMarca(input);
        input.focus();
    }

function removerMarcaCampo(botao){
    const tr = botao.closest('tr');
    const opcao = botao.closest('.marca-opcao');
    const lojaIndex = Number(opcao.dataset.loja);
    const opcaoIndex = Number(opcao.dataset.opcao);
    const container = opcao.parentElement;
    const linhas = [...container.querySelectorAll('.marca-opcao')];
    const desconto = tr.querySelector(`.desc-opcao[data-loja="${lojaIndex}"][data-opcao="${opcaoIndex}"]`);

    if(linhas.length <= 1){
        opcao.querySelectorAll('input').forEach(input => input.value = '');
        if(desconto){
            desconto.querySelectorAll('input').forEach(input => input.value = '');
            desconto.classList.remove('menor');
        }
        recalcularLinha(tr);
        calcular();
        return;
    }

    opcao.remove();
    if(desconto) desconto.remove();
    atualizarIndicesOpcoes(tr, lojaIndex);
    ajustarCamposPeca();
    recalcularLinha(tr);
    calcular();
}

function addLinha(dados = {}){
    const tr = document.createElement("tr");
    const opcoesPorLoja = normalizarOpcoesPorLoja(dados, lojas.length);
    const pecaTexto = normalizarTexto(dados.peca || "");
    let html = `<td class="peca-divider peca-td"><div class="peca-cell"><button type="button" class="btn-remover-peca" onclick="removerLinha(this)" title="Excluir peça">🗑</button><textarea class="peca-input" rows="1" oninput="ajustarCampoPeca(this)" onblur="ajustarCampoPeca(this)" title="${escapeHtml(pecaTexto)}">${escapeHtml(pecaTexto)}</textarea><div class="peca-print-text">${escapeHtml(pecaTexto)}</div></div></td>`;

    lojas.forEach((_,i)=>{
        const dividerClass = i < lojas.length - 1 ? 'loja-divider' : '';
        const opcoes = opcoesPorLoja[i] && opcoesPorLoja[i].length ? opcoesPorLoja[i] : [{ marca:'', valor:'' }];
        const opcoesHtml = opcoes.map((opcao, idx) => criarOpcaoValorHtml(i, idx, opcao)).join('');
        const descontosHtml = opcoes.map((_, idx) => criarOpcaoDescontoHtml(i, idx)).join('');

        html += `
            <td class="valor-td">
                <div class="valor-bloco" data-loja="${i}">
                    <div class="opcoes-container" data-loja="${i}">
                        ${opcoesHtml}
                    </div>
                    <button type="button" class="btn-add-marca" onclick="addMarcaCampo(this)">+ Marca</button>
                </div>
            </td>
            <td class="desc-td ${dividerClass}">
                <div class="descontos-container" data-loja="${i}">
                    ${descontosHtml}
                </div>
            </td>
        `;
    });

    tr.innerHTML = html;
    document.getElementById("corpo").appendChild(tr);

    ajustarCamposPeca();
    ajustarCamposMarca();
    recalcularLinha(tr);
    calcular();
}

function removerLinha(btn){
    btn.closest("tr").remove();
    calcular();
}

function calc(el){
    const tr = el.closest("tr");
    recalcularLinha(tr);
    calcular();
}

function recalcularLinha(tr){
    lojas.forEach((l,i)=>{
        const valores = [...tr.querySelectorAll(`.valor-input[data-loja="${i}"]`)];

        valores.forEach((valor, idx) => {
            const final = tr.querySelector(`.desc-input[data-loja="${i}"][data-opcao="${idx}"]`);
            const valorNumero = parseMoeda(valor?.value);

            if(valorNumero && final){
                final.value = moeda(valorNumero * (1 - l.perc/100));
            } else if(final) {
                final.value = "";
            }
        });
    });

    sincronizarLinhasVisuais(tr);
    destacarMenor(tr);
}

function destacarMenor(tr){
    const valores = [];

    tr.querySelectorAll('.desc-opcao').forEach(el => el.classList.remove('menor'));

    lojas.forEach((_,i)=>{
        tr.querySelectorAll(`.desc-input[data-loja="${i}"]`).forEach(desc => {
            if(desc.value){
                valores.push({
                    valor: parseMoeda(desc.value),
                    el: desc.closest('.desc-opcao') || desc.parentElement
                });
            }
        });
    });

    if(!valores.length) return;

    const min = Math.min(...valores.map(v=>v.valor));
    valores.forEach(v=>{
        if(v.valor === min){
            v.el.classList.add("menor");
        }
    });
}

function calcular(){
    let totalValor = lojas.map(()=>0);
    let totalFinal = lojas.map(()=>0);

    document.querySelectorAll("#corpo tr").forEach(tr=>{
        lojas.forEach((_,i)=>{
            tr.querySelectorAll(`.valor-input[data-loja="${i}"]`).forEach(valorInput => {
                totalValor[i] += parseMoeda(valorInput?.value);
            });

            tr.querySelectorAll(`.desc-input[data-loja="${i}"]`).forEach(descInput => {
                totalFinal[i] += parseMoeda(descInput?.value);
            });
        });
    });

    totalValor.forEach((t,i)=>{
        const tv = document.getElementById("tv"+i);
        const td = document.getElementById("td"+i);
        if(tv) tv.innerText = moeda(t);
        if(td) td.innerText = moeda(totalFinal[i]);
    });
}

function toggleDescontos(){
    const el = document.getElementById("linhaPerc");
    if(!el) return;
    setDescontosRecolhidos(!el.classList.contains('discounts-collapsed'));
}

function capturarLinhas(preservarVazias = false, quantidadeLojas = lojas.length){
    const linhas = [...document.querySelectorAll('#corpo tr')].map(tr => {
        const opcoes = Array.from({ length: quantidadeLojas }, (_, i) => {
            const lista = [...tr.querySelectorAll(`.marca-opcao[data-loja="${i}"]`)].map(opcao => {
                const marca = normalizarTexto(opcao.querySelector('.marca-input')?.value || '').trim();
                const valor = normalizarValorSalvo(opcao.querySelector('.valor-input')?.value || '');
                return { marca, valor };
            });

            const filtrada = lista.filter(item => item.marca || item.valor);
            return preservarVazias ? (lista.length ? lista : [{ marca:'', valor:'' }]) : filtrada;
        });

        return {
            peca: normalizarTexto(tr.querySelector('.peca-input')?.value || "").trim(),
            valores: opcoes.map(lista => normalizarValorSalvo(lista.find(item => item.valor)?.valor || '')),
            marcas: opcoes.map(lista => lista.map(item => item.marca).filter(Boolean)),
            opcoes
        };
    });

    return preservarVazias
        ? linhas
        : linhas.filter(item =>
            item.peca ||
            item.opcoes.some(lista => lista.some(opcao => opcao.marca || opcao.valor))
        );
}

function dataHojeISO(){
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, '0');
    const dia = String(hoje.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
}

function preencherDataPadrao(){
    const campoData = document.getElementById('data');
    if(campoData && !campoData.value){
        campoData.value = dataHojeISO();
    }
}

function formatarDataBR(dataISO){
    if(!dataISO) return '';
    const partes = String(dataISO).split('-');
    if(partes.length !== 3) return dataISO;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function gerarLinhaInformacoes(separador = ' | '){
    const data = formatarDataBR(document.getElementById('data').value);
    const carro = normalizarTexto(document.getElementById('carro').value.trim());
    const placa = normalizarTexto(document.getElementById('placa').value.trim());

    const partes = [];
    if(data) partes.push(`DATA: ${data}`);
    if(carro) partes.push(`CARRO: ${carro}`);
    if(placa) partes.push(`PLACA: ${placa}`);

    return partes.join(separador);
}

function atualizarInfoImpressao(){
    const info = document.getElementById('infoImpressao');
    if(info){
        const dados = gerarLinhaInformacoes(' | ');
        const descontos = lojas
            .map(loja => `${normalizarTexto(loja.nome || '')}: ${String(loja.perc ?? 0).replace('.', ',')}%`)
            .join(' · ');
        const partes = [];
        if(dados) partes.push(dados);
        if(descontos) partes.push(`DESCONTOS: ${descontos}`);
        info.textContent = partes.join(' | ') || 'ORÇAMENTOS FR MOTORS';
    }
}

function gerarTituloOrcamento(){
    const data = formatarDataBR(document.getElementById('data').value);
    const carro = normalizarTexto(document.getElementById('carro').value.trim());
    const placa = normalizarTexto(document.getElementById('placa').value.trim());
    const partes = [carro, placa, data].filter(Boolean);
    return partes.length ? partes.join(' - ') : `ORÇAMENTO ${new Date().toLocaleString('pt-BR')}`;
}

async function salvar(){
    if(!currentUser){ showAuth(); return; }
    preencherDataPadrao();
    const linhas = capturarLinhas();

    if(!linhas.length){
        alert('Preencha pelo menos uma peça antes de salvar.');
        return;
    }

    registrarMarcasDigitadas(coletarMarcasDoFormulario());
    setCloudStatus('Salvando...', false);

    const id = currentOrcamentoId || uuid();
    const payload = {
        id,
        titulo: gerarTituloOrcamento(),
        data: document.getElementById('data').value || null,
        carro: normalizarTexto(document.getElementById('carro').value) || null,
        placa: normalizarTexto(document.getElementById('placa').value) || null,
        lojas: lojas.map(loja => ({ nome: normalizarTexto(loja.nome), perc: loja.perc })),
        linhas,
        updated_at: new Date().toISOString()
    };

    if(!cloudOrcamentosReady){
        currentOrcamentoId = id;
        const localItem = {
            ...payload,
            data:payload.data || '',
            carro:payload.carro || '',
            placa:payload.placa || '',
            created_at:orcamentosCache.find(item => String(item.id) === String(id))?.created_at || new Date().toISOString()
        };
        const idx = orcamentosCache.findIndex(item => String(item.id) === String(id));
        if(idx >= 0) orcamentosCache[idx] = localItem; else orcamentosCache.unshift(localItem);
        orcamentosCache.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
        salvarCacheLocal();
        renderLista(document.getElementById('busca').value);
        sidebar.classList.add('show');
        setCloudStatus('Salvo localmente · nuvem pendente', false);
        return;
    }

    const { data, error } = await db.from('orcamentos').upsert(payload,{onConflict:'id'}).select().single();
    if(error){
        console.error(error);
        ativarModoLocal(error.message || error);
        const localItem = {
            ...payload,
            data:payload.data || '',
            carro:payload.carro || '',
            placa:payload.placa || '',
            created_at:new Date().toISOString()
        };
        currentOrcamentoId = id;
        const idxLocal = orcamentosCache.findIndex(item => String(item.id) === String(id));
        if(idxLocal >= 0) orcamentosCache[idxLocal] = localItem; else orcamentosCache.unshift(localItem);
        salvarCacheLocal();
        renderLista(document.getElementById('busca').value);
        setCloudStatus('Salvo localmente · nuvem pendente', false);
        return;
    }

    currentOrcamentoId = data.id;
    const mapped = mapOrcamento(data);
    const idx = orcamentosCache.findIndex(item => item.id === mapped.id);
    if(idx >= 0) orcamentosCache[idx] = mapped; else orcamentosCache.unshift(mapped);
    orcamentosCache.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
    renderLista(document.getElementById('busca').value);
    sidebar.classList.add('show');
    setCloudStatus(`Online · ${currentUser.email || 'usuário'}`, true);
    alert('Orçamento salvo na nuvem.');
}

function obterOrcamentos(){
    return orcamentosCache;
}

function renderLista(filtro = ''){
    const listaEl = document.getElementById('lista');
    if(!listaEl) return;
    if(!currentUser){
        listaEl.innerHTML = `<div class="sidebar-vazio">Entre no sistema para ver os orçamentos.</div>`;
        return;
    }
    const termo = filtro.trim().toLowerCase();
    const orcamentos = obterOrcamentos().filter(item =>
        String(item.titulo || '').toLowerCase().includes(termo) ||
        String(item.carro || '').toLowerCase().includes(termo) ||
        String(item.placa || '').toLowerCase().includes(termo)
    );

    if(!orcamentos.length){
        listaEl.innerHTML = `<div class="sidebar-vazio">Nenhum orçamento salvo.</div>`;
        return;
    }

    listaEl.innerHTML = orcamentos.map(item => {
        const idSeguro = escapeHtml(String(item.id || ''));
        return `
        <div class="sidebar-item">
            <button class="btn-nome" onclick="carregarOrcamento('${idSeguro}')">${escapeHtml(item.titulo || 'ORÇAMENTO')}</button>
            <button class="btn-delete" onclick="event.stopPropagation(); excluirOrcamento('${idSeguro}')">🗑</button>
        </div>`;
    }).join('');
}

function filtrarLista(){
    renderLista(document.getElementById('busca').value);
}

function carregarOrcamento(id){
    const item = obterOrcamentos().find(o => String(o.id) === String(id));
    if(!item) return;

    currentOrcamentoId = item.id;
    lojas = (item.lojas && item.lojas.length) ? item.lojas.map(loja => ({
        nome: normalizarTexto(loja.nome),
        perc: parsePercentual(loja.perc)
    })) : lojas;

    document.getElementById('data').value = item.data || dataHojeISO();
    document.getElementById('carro').value = normalizarTexto(item.carro || '');
    document.getElementById('placa').value = normalizarTexto(item.placa || '');

    renderTabela((item.linhas || []).map(linha => ({
        ...linha,
        peca: normalizarTexto(linha.peca || ''),
        opcoes: normalizarOpcoesPorLoja(linha, lojas.length),
        marcas: normalizarMarcasPorLoja(linha.marcas || [], lojas.length)
    })));
    renderPerc();
    atualizarInfoImpressao();
    sidebar.classList.remove('show');
}

async function excluirOrcamento(id){
    const item = obterOrcamentos().find(o => String(o.id) === String(id));
    if(!item) return;
    if(!confirm(`Excluir ${item.titulo || 'este orçamento'}?`)) return;
    if(!cloudOrcamentosReady){
        orcamentosCache = orcamentosCache.filter(item => String(item.id) !== String(id));
        salvarCacheLocal();
    } else {
        const { error } = await db.from('orcamentos').delete().eq('id',id);
        if(error){
            console.error(error);
            ativarModoLocal(error.message || error);
            orcamentosCache = orcamentosCache.filter(item => String(item.id) !== String(id));
            salvarCacheLocal();
        } else {
            orcamentosCache = orcamentosCache.filter(item => String(item.id) !== String(id));
        }
    }
    if(String(currentOrcamentoId) === String(id)) novoOrcamento(false);
    renderLista(document.getElementById('busca').value);
}

function novoOrcamento(confirmar=true){
    if(confirmar){
        const temDados = document.getElementById('carro').value.trim() || document.getElementById('placa').value.trim() || capturarLinhas().length;
        if(temDados && !confirm('Criar um novo orçamento? As alterações ainda não salvas desta tela serão descartadas.')) return;
    }
    currentOrcamentoId = null;
    lojas = [
        { nome:'PARQUE', perc:15 },
        { nome:'MEGA', perc:14.5 },
        { nome:'LOPES', perc:10 }
    ];
    document.getElementById('data').value = dataHojeISO();
    document.getElementById('carro').value = '';
    document.getElementById('placa').value = '';
    renderTabela();
    renderPerc();
    atualizarInfoImpressao();
    sidebar.classList.remove('show');
}

function coletarMarcasDoFormulario(){
    return [...document.querySelectorAll('.marca-input')].map(input => input.value);
}

function extrairMarcas(valor){
    if(Array.isArray(valor)){
        return valor.flatMap(item => extrairMarcas(item));
    }

    return String(valor || '')
        .split(/[,;\n]+/)
        .map(item => normalizarTexto(item.trim()))
        .filter(Boolean);
}

function obterMarcasAutocomplete(){
    try {
        return JSON.parse(localStorage.getItem(MARCAS_KEY)) || [];
    } catch (e) {
        return [];
    }
}

function registrarMarcasDigitadas(valores){
    const atuais = new Set(obterMarcasAutocomplete().map(item => normalizarTexto(item).trim()).filter(Boolean));
    extrairMarcas(valores).forEach(marca => atuais.add(marca));

    const marcas = [...atuais].sort((a,b) => a.localeCompare(b, 'pt-BR'));
    localStorage.setItem(MARCAS_KEY, JSON.stringify(marcas));
    renderDatalistMarcas();
}

function importarMarcasDosOrcamentos(){
    const marcas = [];
    obterOrcamentos().forEach(orcamento => {
        (orcamento.linhas || []).forEach(linha => {
            marcas.push(linha.marcas || []);
            marcas.push((linha.opcoes || []).map(lista => (lista || []).map(item => item.marca || '')));
        });
    });
    registrarMarcasDigitadas(marcas);
}

function renderDatalistMarcas(){
    const datalist = document.getElementById('marcasDatalist');
    if(!datalist) return;

    datalist.innerHTML = obterMarcasAutocomplete()
        .map(marca => `<option value="${escapeHtml(marca)}"></option>`)
        .join('');
}

function limparImpressao(){
    document.body.classList.remove('printing');
    document.documentElement.style.setProperty('--print-scale', '1');

    const estiloAntigo = document.getElementById('print-orientation-style');
    if(estiloAntigo){
        estiloAntigo.remove();
    }
}

async function imprimirPDF(){
    sidebar.classList.remove('show');
    preencherDataPadrao();
    atualizarInfoImpressao();
    ajustarCamposPeca();
    ajustarCamposMarca();

    const area = document.querySelector('.table-container');
    if(!area){
        alert('Tabela não encontrada para gerar o PDF.');
        return;
    }

    if(typeof html2canvas !== 'function' || !window.jspdf?.jsPDF){
        alert('Não foi possível carregar o gerador de PDF neste navegador.');
        return;
    }

    const nomeBase = normalizarNomeArquivo(gerarTituloOrcamento()) || 'orcamento';
    const nomeArquivo = `${nomeBase}.pdf`;
    let captura = null;

    try{
        captura = criarAreaImagem(area);
        await new Promise(resolve => requestAnimationFrame(resolve));

        const canvas = await html2canvas(captura.wrapper, {
            backgroundColor: '#ffffff',
            scale: Math.max(2, window.devicePixelRatio || 1),
            useCORS: true,
            logging: false,
            width: captura.width,
            height: captura.height,
            windowWidth: captura.width,
            windowHeight: captura.height,
            scrollX: 0,
            scrollY: 0
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'mm',
            format: 'a4',
            compress: true
        });

        const margem = 8;
        const larguraPagina = pdf.internal.pageSize.getWidth();
        const alturaPagina = pdf.internal.pageSize.getHeight();
        const larguraUtil = larguraPagina - (margem * 2);
        const alturaUtil = alturaPagina - (margem * 2);
        const alturaPixelsPorPagina = Math.max(
            1,
            Math.floor(canvas.width * (alturaUtil / larguraUtil))
        );

        let y = 0;
        let pagina = 0;

        while(y < canvas.height){
            const alturaTrecho = Math.min(alturaPixelsPorPagina, canvas.height - y);
            const paginaCanvas = document.createElement('canvas');
            paginaCanvas.width = canvas.width;
            paginaCanvas.height = alturaTrecho;

            const ctx = paginaCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, paginaCanvas.width, paginaCanvas.height);
            ctx.drawImage(
                canvas,
                0, y, canvas.width, alturaTrecho,
                0, 0, canvas.width, alturaTrecho
            );

            if(pagina > 0) pdf.addPage('a4', 'landscape');

            const alturaImagem = alturaTrecho * (larguraUtil / canvas.width);
            pdf.addImage(
                paginaCanvas.toDataURL('image/jpeg', 0.94),
                'JPEG',
                margem,
                margem,
                larguraUtil,
                alturaImagem,
                undefined,
                'FAST'
            );

            y += alturaTrecho;
            pagina++;
        }

        // Download direto: não abre visualização/impressão nem página intermediária.
        // O navegador ainda pode exibir a confirmação própria dele se "Perguntar onde salvar"
        // estiver ativado nas configurações do aparelho.
        pdf.save(nomeArquivo);
    }catch(erro){
        console.error(erro);
        alert('Não foi possível gerar o PDF.');
    }finally{
        if(captura && captura.wrapper && captura.wrapper.parentNode){
            captura.wrapper.parentNode.removeChild(captura.wrapper);
        }
    }
}

window.addEventListener('beforeprint', () => {
    atualizarInfoImpressao();
    ajustarCamposPeca();
    ajustarCamposMarca();
});
window.addEventListener('afterprint', limparImpressao);

function criarAreaImagem(area){
    atualizarInfoImpressao();
    ajustarCamposPeca();
    ajustarCamposMarca();

    const tabela = area.querySelector('table');
    const larguraConteudo = Math.max(
        area.scrollWidth,
        tabela ? tabela.scrollWidth : 0,
        area.clientWidth
    );

    const wrapper = document.createElement('div');
    wrapper.style.position = 'fixed';
    wrapper.style.left = '-100000px';
    wrapper.style.top = '0';
    wrapper.style.padding = '16px';
    wrapper.style.background = '#ffffff';
    wrapper.style.zIndex = '-1';
    wrapper.style.width = `${larguraConteudo + 32}px`;
    wrapper.style.boxSizing = 'border-box';

    const info = document.createElement('div');
    info.className = 'info-imagem';
    info.textContent = gerarLinhaInformacoes(' | ') || 'ORÇAMENTOS FR MOTORS';
    info.style.display = 'block';
    info.style.margin = '0 0 10px 0';
    info.style.padding = '8px 10px';
    info.style.border = '1px solid #cde8e1';
    info.style.background = '#eef7f4';
    info.style.color = '#111';
    info.style.fontFamily = "'Segoe UI', Arial";
    info.style.fontSize = '14px';
    info.style.fontWeight = '700';
    info.style.whiteSpace = 'nowrap';

    const cloneArea = area.cloneNode(true);
    cloneArea.style.overflow = 'visible';

    // Na captura completa, a coluna não deve ficar sticky para não sobrepor as lojas.
    cloneArea.querySelectorAll('thead th:first-child, tbody td:first-child, tfoot td:first-child').forEach(el => {
        el.style.position = 'static';
        el.style.left = 'auto';
        el.style.boxShadow = 'none';
    });

    // Na imagem/PDF, deixa a separação entre PEÇAS e lojas um pouco mais visível.
    cloneArea.querySelectorAll('.peca-divider').forEach(el => {
        el.style.borderRight = '1px solid #b8c5ca';
    });
    cloneArea.style.width = `${larguraConteudo}px`;
    cloneArea.style.maxWidth = 'none';
    cloneArea.style.margin = '0';

    const cloneTable = cloneArea.querySelector('table');
    if(cloneTable){
        cloneTable.style.width = `${larguraConteudo}px`;
        cloneTable.style.maxWidth = 'none';
        cloneTable.style.background = '#ffffff';
        cloneTable.style.boxShadow = 'none';
    }

    cloneArea.style.background = '#ffffff';
    cloneArea.querySelectorAll('button, .btn-add-marca, .btn-remover-marca, .btn-remover-peca, .btn-loja-delete').forEach(el => el.remove());
    cloneArea.querySelectorAll('tbody tr, tbody td').forEach(el => {
        el.style.background = '#ffffff';
    });
    cloneArea.querySelectorAll('tfoot tr, tfoot td, .total').forEach(el => {
        el.style.background = '#eeeeee';
    });

    const totalRow = cloneArea.querySelector('tfoot tr');
    if(totalRow){

function normalizarNomeArquivo(nome){
    return String(nome || '')
        .replace(/[\\/:*?"<>|]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}

async function gerarImagem(){
    sidebar.classList.remove('show');

    const area = document.querySelector('.table-container');
    if(!area){
        alert('Tabela não encontrada para gerar a imagem.');
        return;
    }

    if(typeof html2canvas !== 'function'){
        alert('Não foi possível carregar o gerador de imagem neste navegador.');
        return;
    }

    const nomeBase = normalizarNomeArquivo(gerarTituloOrcamento()) || 'orcamento';

    let captura = null;

    try {
        captura = criarAreaImagem(area);
        await new Promise(resolve => requestAnimationFrame(resolve));

        const canvas = await html2canvas(captura.wrapper, {
            backgroundColor: '#ffffff',
            scale: Math.max(2, window.devicePixelRatio || 1),
            useCORS: true,
            logging: false,
            width: captura.width,
            height: captura.height,
            windowWidth: captura.width,
            windowHeight: captura.height,
            scrollX: 0,
            scrollY: 0
        });

        const link = document.createElement('a');
        link.download = `${nomeBase}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    } catch (erro) {
        console.error(erro);
        alert('Não foi possível gerar a imagem da tabela.');
    } finally {
        if(captura && captura.wrapper && captura.wrapper.parentNode){
            captura.wrapper.parentNode.removeChild(captura.wrapper);
        }
    }
}

function escapeHtml(texto){
    return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

/* V4.4.16 JS · MAIÚSCULAS + MEMÓRIA DE SUGESTÕES */
const FR_SUGGEST_PREFIX = 'frmotors_suggest_v1_';
let frSuggestTarget = null;
let frSuggestValues = [];
let frSuggestIndex = -1;

function frUppercaseAllowed(el){
  if(!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) return false;
  if(el.id === 'loginEmail' || el.id === 'loginPassword') return false;
  if(el.matches('[type="email"],[type="password"],[type="date"],[type="number"],[type="file"],[readonly]')) return false;
  if(el.matches('.valor-input,.desc-input')) return false;
  if(el.inputMode === 'decimal' || el.inputMode === 'numeric') return false;
  return true;
}
function frUppercaseField(el){
  if(!frUppercaseAllowed(el) || !el.value) return;
  const start = typeof el.selectionStart === 'number' ? el.selectionStart : null;
  const end = typeof el.selectionEnd === 'number' ? el.selectionEnd : null;
  const upper = el.value.toLocaleUpperCase('pt-BR');
  if(upper === el.value) return;
  el.value = upper;
  if(start !== null && end !== null){ try{ el.setSelectionRange(start,end); }catch(_){} }
}
function frSuggestionKey(el){
  if(!el) return null;
  if(el.id === 'client') return 'cliente';
  if(el.id === 'car' || el.id === 'carro') return 'veiculo';
  if(el.id === 'brand' || el.classList.contains('marca-input')) return 'marca';
  if(el.id === 'plate' || el.id === 'placa') return 'placa';
  if(el.id === 'engine') return 'motor';
  if(el.id === 'technician') return 'tecnico';
  if(el.matches('[data-k="name"],.peca-input')) return 'peca';
  if(el.matches('[data-k="supplier"]')) return 'fornecedor';
  if(el.matches('[data-s="description"]')) return 'servico';
  return null;
}
function frReadSuggestions(key){
  try{
    const value = JSON.parse(localStorage.getItem(FR_SUGGEST_PREFIX + key) || '[]');
    return Array.isArray(value) ? value.filter(Boolean) : [];
  }catch(_){ return []; }
}
function frStoreSuggestion(el, rawValue){
  const key = frSuggestionKey(el);
  if(!key) return;
  const value = String(rawValue ?? el.value ?? '').trim().toLocaleUpperCase('pt-BR');
  if(!value || value.length > 120) return;
  const old = frReadSuggestions(key).filter(v => v !== value);
  const next = [value, ...old].slice(0,40);
  try{ localStorage.setItem(FR_SUGGEST_PREFIX + key, JSON.stringify(next)); }catch(_){}
}
function frGetSuggestBox(){
  let box = document.getElementById('frSuggestBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'frSuggestBox';
    box.className = 'fr-suggest-box';
    document.body.appendChild(box);
  }
  return box;
}
function frHideSuggestions(){
  const box = document.getElementById('frSuggestBox');
  if(box) box.style.display = 'none';
  frSuggestTarget = null;
  frSuggestValues = [];
  frSuggestIndex = -1;
}
function frPositionSuggestions(el){
  const box = frGetSuggestBox();
  const r = el.getBoundingClientRect();
  const w = Math.max(220, Math.min(r.width, 460));
  box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  box.style.top = Math.min(window.innerHeight - 16, r.bottom + 5) + 'px';
  box.style.width = w + 'px';
}
function frApplySuggestion(value){
  const el = frSuggestTarget;
  if(!el) return;
  el.value = value;
  frUppercaseField(el);
  frStoreSuggestion(el,value);
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  el.focus();
  frHideSuggestions();
}
function frEscapeSuggestion(v){
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function frShowSuggestions(el){
  const key = frSuggestionKey(el);
  if(!key){ frHideSuggestions(); return; }
  const current = String(el.value || '').trim().toLocaleUpperCase('pt-BR');
  const values = frReadSuggestions(key)
    .filter(v => !current || v.includes(current))
    .filter(v => v !== current)
    .slice(0,8);
  if(!values.length){ frHideSuggestions(); return; }
  frSuggestTarget = el;
  frSuggestValues = values;
  frSuggestIndex = -1;
  const box = frGetSuggestBox();
  box.innerHTML = values.map((v,i) =>
    '<button type="button" class="fr-suggest-option" data-i="'+i+'" title="'+frEscapeSuggestion(v)+'">'+frEscapeSuggestion(v)+'</button>'
  ).join('');
  box.querySelectorAll('.fr-suggest-option').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      frApplySuggestion(values[Number(btn.dataset.i)]);
    });
  });
  frPositionSuggestions(el);
  box.style.display = 'block';
}
document.addEventListener('input', e => {
  const el = e.target;
  if(!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) return;
  frUppercaseField(el);
  if(frSuggestionKey(el)) frShowSuggestions(el);
}, true);
document.addEventListener('focusin', e => {
  const el = e.target;
  if(!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) return;
  frUppercaseField(el);
  if(frSuggestionKey(el)){
    frStoreSuggestion(el,el.value);
    frShowSuggestions(el);
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if(!(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) return;
  frUppercaseField(el);
  if(frSuggestionKey(el)) frStoreSuggestion(el,el.value);
  setTimeout(() => {
    if(!document.activeElement?.closest?.('#frSuggestBox')) frHideSuggestions();
  },120);
});
document.addEventListener('keydown', e => {
  if(!frSuggestTarget || !frSuggestValues.length) return;
  const box = document.getElementById('frSuggestBox');
  const buttons = box ? [...box.querySelectorAll('.fr-suggest-option')] : [];
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    frSuggestIndex += e.key === 'ArrowDown' ? 1 : -1;
    if(frSuggestIndex < 0) frSuggestIndex = frSuggestValues.length - 1;
    if(frSuggestIndex >= frSuggestValues.length) frSuggestIndex = 0;
    buttons.forEach((b,i)=>b.classList.toggle('active',i===frSuggestIndex));
    buttons[frSuggestIndex]?.scrollIntoView({block:'nearest'});
  }else if(e.key === 'Enter' && frSuggestIndex >= 0){
    e.preventDefault();
    frApplySuggestion(frSuggestValues[frSuggestIndex]);
  }else if(e.key === 'Escape'){
    frHideSuggestions();
  }
});
window.addEventListener('resize', () => { if(frSuggestTarget) frPositionSuggestions(frSuggestTarget); });
window.addEventListener('scroll', () => { if(frSuggestTarget) frPositionSuggestions(frSuggestTarget); }, true);
document.addEventListener('mousedown', e => {
  if(!e.target.closest('#frSuggestBox') && e.target !== frSuggestTarget) frHideSuggestions();
});

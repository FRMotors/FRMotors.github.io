name: Testar relatório documental e atualização de auditoria
on:
  push:
    paths:
      - 'financeiro-documentos-status-core.js'
      - 'financeiro-auditoria-estado-core.js'
      - 'financeiro-auditoria-estado-ui.js'
      - 'financeiro-faturas-estado-core.js'
      - 'financeiro-agenda-faturas.js'
      - 'financeiro-central-vencimentos.js'
      - 'financeiro-faturas-cartoes.js'
      - 'financeiro-vinculos-faturas.js'
      - 'financeiro-conciliacao-documental.js'
      - 'financeiro-pro-ui.js'
      - 'financeiro-documentos.js'
      - 'financeiro-documentos-atualizado.css'
      - 'financeiro-central-auditoria.js'
      - 'financeiro-relatorios-gerenciais.js'
      - 'financeiro-margem-core.js'
      - 'financeiro-margem-os-core.js'
      - 'financeiro-margem-os.js'
      - 'dashboard.html'
      - 'dashboard-data-v4481.js'
      - 'tests/financeiro-margem-os-dashboard.test.cjs'
      - 'financeiro-resumo-operacional.js'
      - 'financeiro-relatorios-gerenciais.css'
      - 'tests/financeiro-margem-lucro.test.cjs'
      - 'financeiro-baixas-operacionais.js'
      - 'financeiro-contas-operacionais.js'
      - 'tests/financeiro-baixas-valor-real.test.cjs'
      - 'sql/migrations/20261123_baixa_boletos_importados_valor_real_ajustado.sql'
      - 'financeiro.html'
      - 'tests/financeiro-documentos-status.test.cjs'
      - 'tests/financeiro-consolidacao.test.cjs'
      - 'tests/financeiro-estabilizacao.test.cjs'
      - 'tests/financeiro-preferencias-fornecedores.test.cjs'
      - 'tests/financeiro-classificacao-administracao.test.cjs'
      - 'financeiro-classificacao.js'
      - 'sql/migrations/20261120_preferencias_fornecedores_por_conta.sql'
      - 'sql/migrations/20261120_estabilizar_financeiro_legado_indices.sql'
      - 'tests/financeiro-auditoria-fornecedores-layout.test.cjs'
      - '.github/workflows/financeiro-documentos.yml'
  pull_request:
    paths:
      - 'financeiro-documentos-status-core.js'
      - 'financeiro-auditoria-estado-core.js'
      - 'financeiro-auditoria-estado-ui.js'
      - 'financeiro-faturas-estado-core.js'
      - 'financeiro-agenda-faturas.js'
      - 'financeiro-central-vencimentos.js'
      - 'financeiro-faturas-cartoes.js'
      - 'financeiro-vinculos-faturas.js'
      - 'financeiro-conciliacao-documental.js'
      - 'financeiro-pro-ui.js'
      - 'financeiro-documentos.js'
      - 'financeiro-documentos-atualizado.css'
      - 'financeiro-central-auditoria.js'
      - 'financeiro-relatorios-gerenciais.js'
      - 'financeiro-margem-core.js'
      - 'financeiro-margem-os-core.js'
      - 'financeiro-margem-os.js'
      - 'dashboard.html'
      - 'dashboard-data-v4481.js'
      - 'tests/financeiro-margem-os-dashboard.test.cjs'
      - 'financeiro-resumo-operacional.js'
      - 'financeiro-relatorios-gerenciais.css'
      - 'tests/financeiro-margem-lucro.test.cjs'
      - 'financeiro-baixas-operacionais.js'
      - 'financeiro-contas-operacionais.js'
      - 'tests/financeiro-baixas-valor-real.test.cjs'
      - 'sql/migrations/20261123_baixa_boletos_importados_valor_real_ajustado.sql'
      - 'financeiro.html'
      - 'tests/financeiro-documentos-status.test.cjs'
      - 'tests/financeiro-consolidacao.test.cjs'
      - 'tests/financeiro-estabilizacao.test.cjs'
      - 'tests/financeiro-preferencias-fornecedores.test.cjs'
      - 'tests/financeiro-classificacao-administracao.test.cjs'
      - 'financeiro-classificacao.js'
      - 'sql/migrations/20261120_preferencias_fornecedores_por_conta.sql'
      - 'sql/migrations/20261120_estabilizar_financeiro_legado_indices.sql'
      - 'tests/financeiro-auditoria-fornecedores-layout.test.cjs'
      - '.github/workflows/financeiro-documentos.yml'
permissions:
  contents: read
jobs:
  test-documental:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar vinculações, anos e valores documentais
        run: node --test tests/financeiro-documentos-status.test.cjs tests/financeiro-auditoria-fornecedores-layout.test.cjs tests/financeiro-consolidacao.test.cjs tests/financeiro-estabilizacao.test.cjs tests/financeiro-preferencias-fornecedores.test.cjs tests/financeiro-classificacao-administracao.test.cjs tests/financeiro-margem-lucro.test.cjs tests/financeiro-margem-os-dashboard.test.cjs tests/financeiro-baixas-valor-real.test.cjs
      - name: Validar sintaxe de baixa e carteira
        run: node --check financeiro-baixas-operacionais.js && node --check financeiro-contas-operacionais.js
      - name: Verificar sintaxe do painel de margem por O.S.
        run: node --check financeiro-margem-os-core.js && node --check financeiro-margem-os.js && node --check dashboard-data-v4481.js
